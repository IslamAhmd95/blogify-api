services:
  db:
    image: mysql:8.0-debian
    container_name: db
    restart: always
    environment:
      - MYSQL_DATABASE=${DATABASE_DB}
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    container_name: redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
      
  backend:
    build: .
    container_name: backend
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8001:8000"
    env_file:
      - .env

volumes:
  mysql_data:
  redis_data: